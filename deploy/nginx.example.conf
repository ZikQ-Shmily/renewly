# Put this server block behind your HTTPS certificate configuration.
# Replace renewly.example.com and certificate paths with your own values.
server {
    listen 443 ssl;
    server_name renewly.example.com;

    ssl_certificate /etc/letsencrypt/live/renewly.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/renewly.example.com/privkey.pem;

    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name renewly.example.com;
    return 301 https://$host$request_uri;
}
